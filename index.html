<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Claude Avatar Picker — Set any of the 72 hidden avatars</title>
    <meta
      name="description"
      content="Browse all 72 built-in claude.ai profile avatars and copy a one-line console command to apply any of them to your account."
    />
    <meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="author" content="pyyupsk" />
    <meta name="robots" content="index, follow" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Claude Avatar Picker" />
    <meta
      property="og:description"
      content="Browse all 72 built-in claude.ai profile avatars and copy a one-line console command to apply any of them to your account."
    />
    <meta property="og:image" content="/favicon.svg" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Claude Avatar Picker" />
    <meta
      name="twitter:description"
      content="Browse all 72 built-in claude.ai profile avatars and copy a one-line console command to apply any of them to your account."
    />
    <meta name="twitter:image" content="/favicon.svg" />

    <script>
      (() => {
        const prefersDark = globalThis.matchMedia('(prefers-color-scheme: dark)').matches;
        let resolved = prefersDark ? 'dark' : 'light';
        try {
          const stored = localStorage.getItem('theme');
          if (stored === 'light' || stored === 'dark') resolved = stored;
        } catch {}
        document.documentElement.dataset.mode = resolved;
        document.documentElement.style.colorScheme = resolved;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
